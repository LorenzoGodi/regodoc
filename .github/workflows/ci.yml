name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: "0.16.8"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # La versione è RUFF_VERSION; le impronte sono in tools/requirements/lint.txt.
      - run: python -m pip install --require-hashes --no-deps -r tools/requirements/lint.txt
      - run: ruff check .
      - run: ruff format --check .

  hygiene:
    name: igiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nelle pull request la testa vera del ramo, non il commit di merge sintetico.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: File e messaggi dei commit non ancora in main
        run: python tools/check_hygiene.py --commits origin/main..HEAD
      # Il motore cambiato sopra una versione rilasciata deve alzarla (docs/release.md).
      - name: Versione dopo il rilascio
        run: python tools/check_version.py --base origin/main

  test:
    name: prove (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # Dal sorgente, senza installare: l'installazione la prova il job del pacchetto, con
      # le impronte.
      - run: python -m unittest discover -s tests -t . -v
        env:
          PYTHONPATH: src

  worst:
    name: tempi del caso peggiore (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Fallisce se un caso peggiore supera due terzi del tempo dichiarato per validate o per
      # canon, o se canon, con i limiti del comando vero, rifiuta un caso che dovrebbe scrivere.
      - run: python tools/measure_worst.py --margin 1.5

  package:
    name: pacchetto riproducibile e installazione con le impronte
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Il job TeX installa questo stesso wheel, con questa impronta.
    outputs:
      wheel: ${{ steps.install.outputs.wheel }}
      digest: ${{ steps.install.outputs.digest }}
      version: ${{ steps.install.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tutta la storia: le prove ricostruiscono i commit dei rilasci.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes --no-deps -r tools/requirements/build.txt
      # Le prove di costruzione, che negli altri job si saltano per mancanza di flit_core:
      # due costruzioni uguali, file non tracciati fuori, --commit e i commit dei rilasci.
      - name: Prove della costruzione, con flit_core
        run: python -m unittest tests.test_packaging -v
        env:
          PYTHONPATH: src
          REGODOC_TEST_BUILD: "1"
      # Due costruzioni con umask diverse, stessi byte; versione e licenza nei metadati.
      - run: python tools/build_release.py --out dist --check
      - name: Installazione del wheel con la sua impronta, in un ambiente pulito
        id: install
        run: |
          wheel="$(ls dist/*.whl)"
          digest="$(sha256sum "$wheel" | cut -d ' ' -f 1)"
          name="$(basename "$wheel")"
          {
            echo "wheel=$name"
            echo "digest=$digest"
            echo "version=$(echo "$name" | cut -d - -f 2)"
          } >> "$GITHUB_OUTPUT"
          echo "regodoc @ file://$PWD/$wheel --hash=sha256:$digest" > "$RUNNER_TEMP/pin.txt"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/pin.txt"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/regodoc" --version
          "$RUNNER_TEMP/venv/bin/regodoc" info
          "$RUNNER_TEMP/venv/bin/python" -m regodoc info > /dev/null
          test -z "$("$RUNNER_TEMP/venv/bin/python" -m pip list --format=freeze | grep -v -E '^(pip|regodoc)==')"
      # Tutte le prove, con il motore importato dal wheel installato e non da src/: un file che
      # manca nel wheel fa fallire le prove che lo usano e InstalledEngineTest.
      - name: Prove contro il wheel installato
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -t .
        env:
          REGODOC_TEST_INSTALLED: "1"
      # I file che la release di questo commit pubblica, con SHA256SUMS.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regodoc-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  tex:
    name: TeX sull'immagine di riferimento
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Stessa base, con lo stesso digest, dell'immagine di produzione di Rego (Debian trixie).
      image: python:3.12-slim@sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a
    steps:
      - name: Pacchetti dell'immagine di Rego e di quella di collaudo
        run: |
          sed -i 's#http://#https://#g' /etc/apt/sources.list.d/debian.sources
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends \
            lmodern texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-lang-italian texlive-science \
            make poppler-utils git
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versioni
        run: |
          cat /etc/debian_version
          pdflatex --version | head -n 1
          python3 --version
          # Da confrontare con texlive-packages.txt dell'immagine di Rego.
          dpkg-query -W lmodern 'texlive-*'
      # Come nel collaudo di Rego: un utente senza privilegi, che non può scrivere fuori dalla
      # propria cartella. Il motore fissa da sé MKTEXFMT, MKTEXPK e MKTEXTFM a 0.
      - name: Utente non root
        run: |
          useradd --create-home prove
          chown -R prove .
      # Il wheel che il job del pacchetto ha costruito in questa corsa, installato come lo
      # installa Rego: in un venv suo, con --require-hashes sull'impronta calcolata là.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: regodoc-${{ github.sha }}
          path: /tmp/regodoc-dist
      - name: Installazione del wheel della corsa, con la sua impronta
        env:
          WHEEL: ${{ needs.package.outputs.wheel }}
          DIGEST: ${{ needs.package.outputs.digest }}
        run: |
          echo "regodoc @ file:///tmp/regodoc-dist/$WHEEL --hash=sha256:$DIGEST" > /tmp/pin.txt
          python3 -m venv /opt/regodoc
          /opt/regodoc/bin/python -m pip install --require-hashes --no-deps -r /tmp/pin.txt
          echo "installato $WHEEL con sha256:$DIGEST"
          /opt/regodoc/bin/python -m pip list --format=freeze
      # Tutte le prove con il motore importato dal wheel installato, non da src/.
      - name: Prove, con TeX obbligatorio, contro il wheel installato
        run: >-
          runuser -u prove -- env REGODOC_REQUIRE_TEX=1 REGODOC_TEST_INSTALLED=1
          PYTHONDONTWRITEBYTECODE=1 /opt/regodoc/bin/python -m unittest discover -s tests -t . -v
      # info, validate, canon e build in PDF con l'avvio del contratto (§2.2: -I -B, stdin da
      # /dev/null, cartella corrente vuota, solo PATH e TMPDIR) e il tempo del §2.3.
      - name: Il motore installato, avviato come lo avvia Rego
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: >-
          runuser -u prove -- python3 tools/check_install.py --python /opt/regodoc/bin/python
          --version "$VERSION"
